blueprint:
  name: "WATTZAHLS.DE – Washing Machine Finished"
  description: >
    Detects an active wash cycle from the power consumption, then detects when it
    has finished. An input_boolean helper prevents false notifications during normal
    standby. A notification is then sent to the Home Assistant Companion app.
  domain: automation
  source_url: https://github.com/jvdgeest/wattzahls-home-assistant-blueprints/blob/main/automation/waschmaschine-fertig.yaml
  author: WATTZAHLS.DE
  input:
    power_sensor:
      name: Power sensor
      description: Sensor reporting the washing machine's current power consumption in watts.
      selector:
        entity:
          filter:
            domain: sensor
    running_helper:
      name: '"Washing machine running" helper'
      description: An input_boolean that remembers whether the machine has actually run.
      selector:
        entity:
          filter:
            domain: input_boolean
    running_above:
      name: Start threshold
      description: Above this power level, the washing machine is considered to have started.
      default: 10
      selector:
        number:
          min: 0.1
          max: 5000
          step: 0.1
          unit_of_measurement: W
          mode: box
    finished_below:
      name: Completion threshold
      description: Below this power level, the wash cycle can be considered finished.
      default: 3
      selector:
        number:
          min: 0
          max: 500
          step: 0.1
          unit_of_measurement: W
          mode: box
    finished_wait:
      name: Completion wait time
      description: How long the power must remain below the completion threshold.
      default: 120
      selector:
        number:
          min: 10
          max: 7200
          unit_of_measurement: seconds
          mode: box
    notify_device:
      name: Phone with Home Assistant app
      description: Device that should receive the completion notification.
      selector:
        device:
          filter:
            integration: mobile_app
    notification_title:
      name: Title
      default: "Washing machine finished"
      selector:
        text:
    notification_message:
      name: Message
      default: "The washing machine has finished."
      selector:
        text:

mode: restart

triggers:
  - trigger: numeric_state
    entity_id: !input power_sensor
    above: !input running_above
    id: running
  - trigger: numeric_state
    entity_id: !input power_sensor
    below: !input finished_below
    for:
      seconds: !input finished_wait
    id: finished

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: running
        sequence:
          - alias: "Remember active wash cycle"
            action: input_boolean.turn_on
            target:
              entity_id: !input running_helper
      - conditions:
          - condition: trigger
            id: finished
          - condition: state
            entity_id: !input running_helper
            state: "on"
        sequence:
          - alias: "Send completion notification"
            domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: !input notification_title
            message: !input notification_message
          - alias: "Reset running helper"
            action: input_boolean.turn_off
            target:
              entity_id: !input running_helper
